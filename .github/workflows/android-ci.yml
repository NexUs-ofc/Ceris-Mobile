name: Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties
          echo "AUTH_API_BASE_URL=${{ secrets.AUTH_API_BASE_URL }}" >> local.properties
          echo "VIA_CEP_URL=${{ secrets.VIA_CEP_URL }}" >> local.properties
          echo "ACCOUNT_TYPE=${{ secrets.ACCOUNT_TYPE }}" >> local.properties

      - name: Grant permission to Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Build Debug APK
        run: ./gradlew assembleDebug