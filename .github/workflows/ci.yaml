name: Mobile CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

  android-lint:

    runs-on: ubuntu-latest

    needs: build

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android Lint
        run: ./gradlew lintDebug

  detekt:

    runs-on: ubuntu-latest

    needs: build

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt
        run: ./gradlew detekt

  tests:

    runs-on: ubuntu-latest

    needs: build

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

  coverage:

    runs-on: ubuntu-latest

    needs: tests

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Coverage
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification